<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Mode slider (mockup)</title>
<link rel="stylesheet" href="/lib/core.css">
<script src="/lib/core.js"></script>
<style>
/* Mockup: mode slider. Half-circle collar on the left edge; tap opens a vertical dark bar; drag the latch to pick a mode. */
html, body { height: 100%; overflow: hidden; }
body { margin: 0; background: var(--bg); color: var(--txt); font-family: var(--font); --macc: #4285f4; }
.top { height: 56px; display: flex; align-items: center; gap: 8px; padding: 0 12px; }
.top h1 { font-size: 1rem; font-weight: 500; margin: 0; flex: 1; }
.chat { position: absolute; inset: 56px 0 0 0; padding: 12px 16px 16px 40px; overflow: hidden; }
.chat .m { margin: 0 0 14px; line-height: 1.55; max-width: 86%; }
.chat .u { margin-left: auto; background: var(--card); border: 1px solid var(--ol); border-radius: 18px 18px 6px 18px; padding: 9px 14px; }
.chat .a { font-family: var(--serif); }
.chat .a b { color: var(--macc); font-family: var(--font); font-size: .8rem; display: block; margin-bottom: 2px; transition: color .2s; }
.bar-f { position: absolute; left: 40px; right: 16px; bottom: 16px; height: 48px; border-radius: 28px; border: 1.5px solid var(--macc); background: var(--surf); display: flex; align-items: center; padding: 0 18px; color: var(--muted); transition: border-color .2s; }
.hintp { position: absolute; left: 40px; right: 16px; bottom: 74px; font-size: .76rem; color: var(--sub); }
/* collar */
.collar { position: absolute; left: 0; top: 46%; width: 26px; height: 64px; margin-top: -32px; border-radius: 0 40px 40px 0; background: var(--macc); border: 0; padding: 0; cursor: pointer; z-index: 5; display: flex; align-items: center; justify-content: center; color: #000; transition: background .2s, transform .15s; box-shadow: 0 0 0 1px rgba(255,255,255,.14); }
.collar svg { width: 16px; height: 16px; }
.collar:active { transform: translateX(2px); }
/* vertical bar */
.scrim { position: absolute; inset: 0; z-index: 6; display: none; background: rgba(0,0,0,.35); }
.scrim.open { display: block; }
.vbar { position: absolute; left: 10px; top: 50%; transform: translateY(-50%) translateX(-130%); z-index: 7; width: 188px; padding: 14px 10px; border-radius: 34px; background: #0b0c0e; border: 1px solid var(--edge); box-shadow: 0 10px 40px rgba(0,0,0,.6); transition: transform .22s cubic-bezier(.2,.8,.2,1); touch-action: none; }
.vbar.open { transform: translateY(-50%) translateX(0); }
.mo { display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 8px; border-radius: 28px; user-select: none; -webkit-user-select: none; }
.mo i { width: 34px; height: 34px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 2px rgba(255,255,255,.12); }
.mo span { font-size: .95rem; color: var(--sub); }
.mo.on span { color: var(--txt); font-weight: 600; }
.latch { position: absolute; left: 6px; top: 14px; width: 176px; height: 56px; border-radius: 28px; border: 2px solid var(--macc); pointer-events: none; transition: top .18s cubic-bezier(.2,.8,.2,1), border-color .2s; }
.vbar.drag .latch { transition: none; }
.legend { position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 16px; font-size: .72rem; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<div class="top">
    <a class="ibtn" href="/tools/design/index.html" aria-label="Back"><svg class="i"><use href="/lib/icons.svg#i-arrow-l"/></svg></a>
    <h1 id="h"></h1>
</div>
<div class="chat" id="chat"></div>
<div class="hintp" id="hint"></div>
<div class="bar-f" id="barf"></div>
<button class="collar" id="collar" type="button" aria-label="Mode"><svg class="i"><use href="/lib/icons.svg#i-chev-r"/></svg></button>
<div class="scrim" id="scrim"></div>
<div class="vbar" id="vbar" role="listbox" aria-label="Mode"><div class="latch" id="latch"></div></div>
<script>
(function () {
    var MODES = [
        { id: 'wilson', c: '#00acc1', en: 'Wilson', de: 'Wilson', d: { en: 'Short and factual.', de: 'Kurz und sachlich.' } },
        { id: 'heinz', c: '#e91e63', en: 'Heinz', de: 'Heinz', d: { en: 'Warm, with a little humour.', de: 'Warm, mit etwas Humor.' } },
        { id: 'audit', c: '#d2b56a', en: 'Audit', de: 'Audit', d: { en: 'Checks and lists the gaps.', de: 'Prüft und nennt die Lücken.' } },
        { id: 'code', c: '#6b8ba4', en: 'Code', de: 'Code', d: { en: 'Code first, brief notes.', de: 'Erst Code, kurze Hinweise.' } },
        { id: 'creative', c: '#b184ec', en: 'Creative', de: 'Kreativ', d: { en: 'Free and playful.', de: 'Frei und verspielt.' } }
    ];
    var T = { en: { h: 'Mode slider (mockup)', u: 'Explain a mutex in one line.', hint: 'Tap the collar on the left edge, drag the frame up or down.', ph: 'Write a message', leg: 'Mockup: no model is called.', a: 'A mutex lets only one thread use a resource at a time.' },
              de: { h: 'Modus-Schieberegler (Mockup)', u: 'Erkläre einen Mutex in einer Zeile.', hint: 'Tippe auf den Kragen am linken Rand, ziehe den Rahmen nach oben oder unten.', ph: 'Nachricht schreiben', leg: 'Mockup: Es wird kein Modell aufgerufen.', a: 'Ein Mutex lässt immer nur einen Thread auf eine Ressource zugreifen.' } };
    var $ = function (id) { return document.getElementById(id); };
    var cur = Math.max(0, MODES.map(function (m) { return m.id; }).indexOf(Heinz.lsGet('heinz_mock_mode', 'heinz') || 'heinz'));
    var ROW = 56, PAD = 14;
    var bar = $('vbar'), latch = $('latch');
    bar.insertAdjacentHTML('beforeend', MODES.map(function (m, i) { return '<div class="mo" role="option" data-i="' + i + '"><i style="background:' + m.c + '"></i><span></span></div>'; }).join(''));
    function L() { return Heinz.lang === 'de' ? 'de' : 'en'; }
    function paint() {
        var m = MODES[cur], tx = T[L()];
        document.body.style.setProperty('--macc', m.c);
        $('h').textContent = tx.h; $('hint').textContent = tx.hint; $('barf').textContent = tx.ph;
        $('chat').innerHTML = '<div class="m u">' + tx.u + '</div><div class="m a"><b>' + m[L()] + '</b>' + tx.a + ' <span style="color:var(--sub);font-size:.8rem">(' + m.d[L()] + ')</span></div><div class="legend">' + tx.leg + '</div>';
        [].forEach.call(bar.querySelectorAll('.mo'), function (el, i) { el.classList.toggle('on', i === cur); el.querySelector('span').textContent = MODES[i][L()]; el.setAttribute('aria-selected', i === cur); });
        latch.style.top = (PAD + cur * ROW) + 'px'; latch.style.borderColor = m.c;
        bar.style.height = (PAD * 2 + MODES.length * ROW) + 'px';
    }
    function open(b) { bar.classList.toggle('open', b); $('scrim').classList.toggle('open', b); }
    function set(i, keep) { cur = Math.max(0, Math.min(MODES.length - 1, i)); Heinz.lsSet('heinz_mock_mode', MODES[cur].id); paint(); if (!keep) setTimeout(function () { open(false); }, 180); }
    function idxAt(y) { var r = bar.getBoundingClientRect(); return Math.max(0, Math.min(MODES.length - 1, Math.floor((y - r.top - PAD) / ROW))); }
    $('collar').onclick = function () { open(!bar.classList.contains('open')); };
    $('scrim').onclick = function () { open(false); };
    var dragging = false;
    bar.addEventListener('pointerdown', function (e) { dragging = true; bar.classList.add('drag'); bar.setPointerCapture(e.pointerId); set(idxAt(e.clientY), true); });
    bar.addEventListener('pointermove', function (e) { if (!dragging) return; var r = bar.getBoundingClientRect(); var y = Math.max(PAD, Math.min(r.height - PAD - ROW, e.clientY - r.top - ROW / 2)); latch.style.top = y + 'px'; var i = idxAt(e.clientY); if (i !== cur) { cur = i; Heinz.lsSet('heinz_mock_mode', MODES[cur].id); var top = latch.style.top; paint(); latch.style.top = top; } });
    function end() { if (!dragging) return; dragging = false; bar.classList.remove('drag'); paint(); setTimeout(function () { open(false); }, 220); }
    bar.addEventListener('pointerup', end); bar.addEventListener('pointercancel', end);
    Heinz.onLang(paint); paint();
})();
</script>
</body>
</html>
