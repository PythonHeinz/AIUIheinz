<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#121212">
<link rel="manifest" href="/manifest.webmanifest">
<title>AIUIheinz · docHeinz</title>
<link rel="stylesheet" href="../../lib/core.css">
<link rel="stylesheet" href="docheinz.css">
<script src="../../lib/core.js"></script>
</head>
<body>
<div id="app-header"></div>
<main class="page dh" id="lib">
    <section class="panel" id="sec-add">
        <div class="caps grp"><span data-i="s_add"></span><span class="scope" id="count"></span></div>
        <label class="pill acc dh-addbtn" id="b-add"><svg class="i sm"><use href="../../lib/icons.svg#i-plus"/></svg><span data-i="add"></span><input type="file" id="file" class="sr-only" multiple accept=".epub,.md,.markdown,.txt,.html,.htm,.xhtml,.pdf,application/pdf,image/*,.jpg,.jpeg,.png,.webp,application/epub+zip,text/plain,text/markdown,text/html"></label>
        <input type="file" id="file-cam" class="sr-only" accept="image/*" capture="environment">
        <input type="file" id="file-pg" class="sr-only" multiple accept="image/*">
        <button type="button" class="pill dh-camopen" id="b-cam" hidden><span data-i="k_open"></span></button>
        <div class="help" data-i="add_help"></div>
    <div class="notice" id="msg" role="status" hidden></div>
    </section>

    <section class="dh-shelf" id="sec-shelf">
        <div class="dh-tools" id="tools" hidden>
            <input id="q" class="inp" type="search" autocomplete="off" spellcheck="false" data-ph="search">
            <select id="sort" class="sel"></select>
        </div>
        <div id="list" class="panel dh-list" aria-live="polite"></div>
        <p class="dh-empty" id="empty" hidden></p>
    </section>
    <div class="help dh-store" id="store"></div>
</main>

<div class="dh-cam" id="cam" hidden>
    <video id="cam-v" playsinline muted autoplay></video>
    <div class="dh-camguide" id="cam-g" aria-hidden="true"></div>
    <div class="dh-camlevel" id="cam-l" aria-hidden="true"><i id="cam-ld"></i></div>
    <div class="dh-camflash" id="cam-f"></div>
    <div class="dh-camtop"><span id="cam-n"></span><button type="button" class="pill dh-camrot" id="cam-r" data-i-label="k_rotate">↻</button></div>
    <div class="dh-camthumbs" id="cam-t"></div>
    <div class="dh-cambar">
        <button type="button" class="pill" id="cam-x" data-i="k_cancel"></button>
        <button type="button" class="pill" id="cam-u" data-i="k_undo"></button>
        <button type="button" class="dh-shutter" id="cam-s" data-i-label="k_shoot"></button>
        <button type="button" class="pill acc" id="cam-d" data-i="k_done"></button>
    </div>
</div>
<div class="dh-reader" id="reader" data-rt="auto" data-font="serif" hidden>
    <div class="dh-cpage" id="r-cover" hidden><img id="r-cimg" alt="" hidden><div class="dh-ctitle" id="r-ctitle" hidden><b id="r-ct"></b><span id="r-ca"></span></div></div>
    <div class="dh-page" id="r-page"><div class="dh-clip" id="r-clip"><article class="dh-text" id="r-body" tabindex="-1"></article></div></div>
    <div class="dh-ov dh-ovtop" id="r-ov" hidden>
        <button type="button" class="ibtn" id="r-close" data-i-label="r_close"><svg class="i"><use href="../../lib/icons.svg#i-arrow-l"/></svg></button>
        <button type="button" class="ibtn" id="r-toc-b" data-i-label="r_toc"><svg class="i"><use href="../../lib/icons.svg#i-menu"/></svg></button>
        <span class="dh-rtitle" id="r-title"></span>
        <button type="button" class="ibtn" id="r-orig-b" data-i-label="o_open" hidden><svg class="i"><use href="../../lib/icons.svg#i-expand"/></svg></button>
        <button type="button" class="ibtn" id="r-set-b" data-i-label="r_set"><svg class="i"><use href="../../lib/icons.svg#i-sliders"/></svg></button>
    </div>
    <div class="dh-ov dh-ovfoot" id="r-ovfoot" hidden>
        <span class="dh-rpos" id="r-pos"></span>
        <span class="dh-bar"><i id="r-prog"></i></span>
    </div>
    <div class="dh-orig" id="r-orig" hidden>
        <div class="dh-ov dh-ovtop dh-origbar">
            <button type="button" class="ibtn" id="o-close" data-i-label="o_close"><svg class="i"><use href="../../lib/icons.svg#i-arrow-l"/></svg></button>
            <span class="dh-rtitle" id="o-pos"></span>
            <button type="button" class="ibtn" id="o-out" data-i-label="o_out"><b class="dh-pm">−</b></button>
            <button type="button" class="ibtn" id="o-in" data-i-label="o_in"><b class="dh-pm">+</b></button>
        </div>
        <div class="dh-oscroll" id="o-scroll"><div class="dh-opages" id="o-pages"></div></div>
    </div>
    <div class="dh-rset" id="r-set" data-pg="main" hidden>
        <div class="dh-rhead"><button type="button" class="ibtn" id="rs-back" data-i-label="r_back" hidden><svg class="i"><use href="../../lib/icons.svg#i-arrow-l"/></svg></button><b id="rs-ttl"></b></div>
        <section class="dh-sp" data-p="main">
            <button type="button" class="row" data-go="fmt"><span class="tile"><svg class="i"><use href="../../lib/icons.svg#i-sliders"/></svg></span><span class="tx"><b data-i="m_fmt"></b><small data-i="m_fmtS"></small></span><span class="go"><svg class="i"><use href="../../lib/icons.svg#i-chev-r"/></svg></span></button>
            <button type="button" class="row" data-go="ai"><span class="tile"><svg class="i"><use href="../../lib/icons.svg#i-sparkle"/></svg></span><span class="tx"><b data-i="m_ai"></b><small data-i="m_aiS"></small></span><span class="go"><svg class="i"><use href="../../lib/icons.svg#i-chev-r"/></svg></span></button>
            <button type="button" class="row" data-chap="sum"><span class="tile"><svg class="i"><use href="../../lib/icons.svg#i-sparkle"/></svg></span><span class="tx"><b data-i="c_sum"></b><small data-i="c_sumS"></small></span></button>
            <button type="button" class="row" data-chap="exp"><span class="tile"><svg class="i"><use href="../../lib/icons.svg#i-sparkle"/></svg></span><span class="tx"><b data-i="c_exp"></b><small data-i="c_expS"></small></span></button>
            <button type="button" class="row" data-chap="ask"><span class="tile"><svg class="i"><use href="../../lib/icons.svg#i-sparkle"/></svg></span><span class="tx"><b data-i="c_ask"></b><small data-i="c_askS"></small></span></button>
            <p class="help" data-i="r_tips"></p>
        </section>
        <section class="dh-sp" data-p="fmt" hidden>
            <label class="fld"><span data-i="l_scope"></span><select class="sel" id="sel-scope"><option value="0" data-i="l_all"></option><option value="1" data-i="l_book"></option></select></label>
            <button type="button" class="row" data-go="font"><span class="tile"><svg class="i"><use href="../../lib/icons.svg#i-doc"/></svg></span><span class="tx"><b data-i="m_font"></b><small data-i="m_fontS"></small></span><span class="go"><svg class="i"><use href="../../lib/icons.svg#i-chev-r"/></svg></span></button>
            <button type="button" class="row" data-go="space"><span class="tile"><svg class="i"><use href="../../lib/icons.svg#i-layers"/></svg></span><span class="tx"><b data-i="m_space"></b><small data-i="m_spaceS"></small></span><span class="go"><svg class="i"><use href="../../lib/icons.svg#i-chev-r"/></svg></span></button>
            <button type="button" class="row" data-go="layout"><span class="tile"><svg class="i"><use href="../../lib/icons.svg#i-expand"/></svg></span><span class="tx"><b data-i="m_layout"></b><small data-i="m_layoutS"></small></span><span class="go"><svg class="i"><use href="../../lib/icons.svg#i-chev-r"/></svg></span></button>
            <button type="button" class="row" data-go="text"><span class="tile"><svg class="i"><use href="../../lib/icons.svg#i-pencil"/></svg></span><span class="tx"><b data-i="m_text"></b><small data-i="m_textS"></small></span><span class="go"><svg class="i"><use href="../../lib/icons.svg#i-chev-r"/></svg></span></button>
            <button type="button" class="row" data-go="color"><span class="tile"><svg class="i"><use href="../../lib/icons.svg#i-contrast"/></svg></span><span class="tx"><b data-i="m_color"></b><small data-i="m_colorS"></small></span><span class="go"><svg class="i"><use href="../../lib/icons.svg#i-chev-r"/></svg></span></button>
            <button type="button" class="row" data-go="ctl"><span class="tile"><svg class="i"><use href="../../lib/icons.svg#i-gauge"/></svg></span><span class="tx"><b data-i="m_ctl"></b><small data-i="m_ctlS"></small></span><span class="go"><svg class="i"><use href="../../lib/icons.svg#i-chev-r"/></svg></span></button>
            <button type="button" class="row" data-go="prof"><span class="tile"><svg class="i"><use href="../../lib/icons.svg#i-save"/></svg></span><span class="tx"><b data-i="m_prof"></b><small data-i="m_profS"></small></span><span class="go"><svg class="i"><use href="../../lib/icons.svg#i-chev-r"/></svg></span></button>
            <button type="button" class="row" id="look-reset"><span class="tile"><svg class="i"><use href="../../lib/icons.svg#i-refresh"/></svg></span><span class="tx"><b data-i="l_reset"></b><small data-i="l_resetS"></small></span></button>
        </section>
        <section class="dh-sp" data-p="font" hidden>
            <label class="fld"><span><span data-i="r_size"></span> <b id="r-sizev"></b></span><input type="range" id="r-size" min="10" max="60" step="1"></label>
            <label class="fld"><span data-i="r_font"></span><select class="sel" id="sel-font"></select></label>
            <label class="fld"><span data-i="r_theme"></span><select class="sel" id="sel-theme"><option value="auto" data-i="t_auto"></option><option value="lt" data-i="t_lt"></option><option value="sepia" data-i="t_sepia"></option><option value="dk" data-i="t_dk"></option><option value="black" data-i="t_black"></option><option value="custom" data-i="t_custom"></option></select></label>
        </section>
        <section class="dh-sp" data-p="space" hidden><div id="lk-space"></div></section>
        <section class="dh-sp" data-p="layout" hidden><div id="lk-margin"></div><div id="lk-cols"></div></section>
        <section class="dh-sp" data-p="text" hidden><div id="lk-text"></div></section>
        <section class="dh-sp" data-p="color" hidden><div id="lk-color"></div></section>
        <section class="dh-sp" data-p="ctl" hidden>
            <label class="row"><span class="tx"><b data-i="r_btns"></b><small data-i="r_btnsS"></small></span><span class="sw"><input type="checkbox" id="sw-btns"><i></i></span></label>
            <label class="row"><span class="tx"><b data-i="r_gap"></b></span><span class="sw"><input type="checkbox" id="sw-gap"><i></i></span></label>
        </section>
        <section class="dh-sp" data-p="prof" hidden><div id="lk-prof"></div></section>
        <section class="dh-sp" data-p="ai" hidden>
            <label class="fld"><span data-i="r_aiSel"></span><select class="sel" id="sel-ai"></select></label>
            <p class="help" id="ai-cur"></p>
            <label class="row"><span class="tx"><b data-i="r_askFirst"></b><small data-i="r_askFirstS"></small></span><span class="sw"><input type="checkbox" id="sw-askfirst"><i></i></span></label>
            <p class="help" data-i="r_aiHint"></p>
            <p class="help"><a href="../../dashboard.html" data-i="r_aiDash"></a></p>
        </section>
    </div>
    <nav class="dh-toc" id="r-toc" hidden>
        <div class="dh-tabs" id="r-tabs"><button type="button" data-tab="toc" class="on" data-i="r_tabToc"></button><button type="button" data-tab="marks" data-i="r_tabMarks"></button></div>
        <div id="r-tocl"></div>
        <div id="r-markl" hidden></div>
    </nav>
    <button type="button" class="dh-turn dh-turn-l" id="r-prev" data-i-label="r_prev" hidden><svg class="i"><use href="../../lib/icons.svg#i-chev-l"/></svg></button>
    <button type="button" class="dh-turn dh-turn-r" id="r-next" data-i-label="r_next" hidden><svg class="i"><use href="../../lib/icons.svg#i-chev-r"/></svg></button>
    <div class="dh-sel" id="r-sel" hidden>
        <button type="button" data-sel="search" class="ic" data-i-label="s_search"><svg class="i"><use href="../../lib/icons.svg#i-search"/></svg></button>
        <button type="button" data-sel="explain" data-i="s_explain"></button>
        <button type="button" data-sel="summary" data-i="s_summary"></button>
        <button type="button" data-sel="mark" data-i="s_mark"></button>
        <button type="button" data-sel="copy" class="ic" data-i-label="s_copy"><svg class="i"><use href="../../lib/icons.svg#i-copy"/></svg></button>
    </div>
    <div class="dh-sel dh-mk" id="r-mk" hidden>
        <button type="button" class="dh-cdot c0" data-c="0"></button><button type="button" class="dh-cdot c1" data-c="1"></button><button type="button" class="dh-cdot c2" data-c="2"></button><button type="button" class="dh-cdot c3" data-c="3"></button>
        <button type="button" data-mk="note" data-i-label="mk_note"><svg class="i"><use href="../../lib/icons.svg#i-pencil"/></svg></button>
        <button type="button" data-mk="del" data-i-label="mk_del"><svg class="i"><use href="../../lib/icons.svg#i-trash"/></svg></button>
    </div>
    <i class="dh-h" id="r-h1" hidden></i><i class="dh-h" id="r-h2" hidden></i>
    <section class="dh-sheet" id="r-sheet" hidden>
        <header><b id="rs-title"></b><button type="button" class="pill" id="rs-copy" data-i="s_copy" hidden></button><button type="button" class="pill" id="rs-note" data-i="s_toNote" hidden></button><button type="button" class="pill" id="rs-more" data-i="s_more" hidden></button><button type="button" class="pill" id="rs-stop" data-i="s_stop" hidden></button><button type="button" class="pill" id="rs-close" data-i="s_close"></button></header>
        <p class="help" id="rs-sub" hidden></p>
        <div class="dh-sbody" id="rs-body"></div>
    </section>
    <section class="dh-ana" id="r-ana" hidden>
        <header><button type="button" class="ibtn" id="ra-close" data-i-label="s_close"><svg class="i"><use href="../../lib/icons.svg#i-arrow-l"/></svg></button><b data-i="s_anaT"></b></header>
        <blockquote id="ra-pass"></blockquote>
        <div class="seg2" id="ra-seg"><button type="button" data-ctx="0" class="on" data-i="s_ctx0"></button><button type="button" data-ctx="1" data-i="s_ctx1"></button></div>
        <p class="help" id="ra-sub"></p>
        <div class="dh-abody" id="ra-body"></div>
        <form class="dh-aform" id="ra-form"><textarea id="ra-q" rows="1" data-ph="s_ask" maxlength="1000"></textarea><button type="submit" class="pill" id="ra-send" data-i="s_send"></button><button type="button" class="pill" id="ra-stop" data-i="s_stop" hidden></button></form>
    </section>
</div>
<script type="module" src="ui/main.js"></script>
</body>
</html>
