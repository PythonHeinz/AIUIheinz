<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark light">
<title>Heinz Chat</title>
<link rel="stylesheet" href="/lib/core.css">
<script src="/lib/core.js"></script>
<style>
/* Heinz Chat: the calm chat (DR2 draft). Reading first, one model switch, no parameters. Own storage keys heinz_slim and heinz_slim_chats. */
html, body { height: 100%; overflow: hidden; }
body { margin: 0; background: var(--bg); color: var(--txt); font-family: var(--font); }
.app { height: var(--appH, 100dvh); display: flex; flex-direction: column; max-width: 680px; margin: 0 auto; padding: 0 12px; }
.top { display: flex; align-items: center; gap: 4px; height: 56px; flex: none; }
.top .mod { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 6px; height: 40px; border-radius: 99px; background: var(--card); border: 1px solid var(--ol); padding: 0 14px; font-size: .9rem; cursor: pointer; color: var(--txt); }
.top .mod span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#note { flex: none; margin: 0 0 8px; }
#log { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 8px 2px 16px; scroll-behavior: smooth; }
.empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: var(--sub); gap: 8px; padding: 0 24px; }
.empty b { font-family: var(--serif); font-weight: 400; font-size: 1.5rem; color: var(--txt); }
.msg { margin: 0 0 18px; line-height: 1.65; }
.msg.u { display: flex; justify-content: flex-end; }
.msg.u div { max-width: 86%; background: var(--card); border: 1px solid var(--ol); border-radius: 20px 20px 6px 20px; padding: 10px 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.a { font-family: var(--serif); font-size: 1.06rem; overflow-wrap: anywhere; }
.msg.a p { margin: 0 0 .8em; } .msg.a ul, .msg.a ol { margin: 0 0 .8em; padding-left: 1.3em; }
.msg.a code { font: .86em var(--mono); background: var(--card); padding: 1px 5px; border-radius: 6px; }
.msg.a pre code { background: none; padding: 0; font-size: .84rem; }   /* code blocks: lib/core.css (.code-wrap) */
.msg.a .cur { display: inline-block; width: .5em; height: 1em; background: var(--pri); vertical-align: -.12em; animation: bl 1s steps(2) infinite; }
@keyframes bl { 50% { opacity: 0; } }
.msg .cp { display: inline-flex; margin-top: 2px; width: 34px; height: 34px; }
.comp { flex: none; display: flex; align-items: flex-end; gap: 8px; padding: 8px 8px 8px 16px; margin: 0 0 max(8px, env(safe-area-inset-bottom)); border-radius: 28px; background: var(--surf); border: 1.5px solid var(--edge); }
.comp textarea { flex: 1; min-width: 0; background: none; border: 0; outline: none; resize: none; color: var(--txt); font: inherit; font-size: 1rem; line-height: 1.45; padding: 9px 0; max-height: 34vh; }
.comp textarea::placeholder { color: var(--muted); }
.comp .round { flex: none; }
.lst .row { border-top: 1px solid var(--line); }
.lst .row small { display: block; color: var(--sub); font-size: .78rem; margin-top: 2px; }
.lst .row.sel b { color: var(--pri); }
.eng { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 10px; }
.eng .pill.on { border-color: var(--pri); color: var(--pri); }
.hint { color: var(--sub); font-size: .82rem; line-height: 1.45; margin: 8px 0; }
.swr { display: flex; align-items: center; gap: 12px; padding: 8px 0; } .swr .tx { flex: 1; font-size: .95rem; }
.row .ibtn { margin-left: auto; }
</style>
</head>
<body>
<div class="app" id="app">
    <div class="top">
        <a class="ring-btn metal s-red" href="/" id="ring" aria-label="Hub"><span class="rt"><svg id="ring-logo" aria-hidden="true" viewBox="0 0 34 22" width="34" height="22"></svg></span></a>
        <button class="mod" id="mod" type="button"><span id="mod-t">…</span><svg class="i sm"><use href="/lib/icons.svg#i-chev-d"/></svg></button>
        <button class="ibtn" id="new" type="button" aria-label="New chat"><svg class="i"><use href="/lib/icons.svg#i-plus"/></svg></button>
        <button class="ibtn" id="hist" type="button" aria-label="Chats"><svg class="i"><use href="/lib/icons.svg#i-chats"/></svg></button>
    </div>
    <div id="note" hidden></div>
    <div id="store-note" class="notice warn" role="status" hidden style="margin: 0 0 8px"></div>
    <div id="log"></div>
    <div class="comp">
        <textarea id="q" rows="1" autocomplete="off"></textarea>
        <button class="round acc" id="send" type="button" aria-label="Send"><svg class="i"><use href="/lib/icons.svg#i-send"/></svg></button>
    </div>
</div>

<div class="bscrim" id="bscrim"></div>
<section class="bsheet" id="sh-model" aria-label="Model">
    <div class="grab"></div>
    <div class="bs-h"><h3 id="sm-h"></h3><button class="ibtn" type="button" data-click="sheetClose" aria-label="Close"><svg class="i"><use href="/lib/icons.svg#i-x"/></svg></button></div>
    <div class="bs-b">
        <div class="eng" id="eng"></div>
        <div class="lst" id="models"></div>
        <label class="fld" id="free-l" hidden></label>
        <input class="inp" id="free" type="text" hidden>
        <div class="swr"><span class="tx" id="onl-t"></span><span class="sw"><input type="checkbox" id="onl"><i></i></span></div>
        <p class="hint" id="onl-h"></p>
        <label class="fld" id="sys-l" for="sys"></label>
        <textarea class="inp" id="sys" rows="4" style="resize:vertical;width:100%;height:auto;padding:10px 12px"></textarea>
        <button type="button" class="pill" id="sys-reset" style="margin-top:6px"></button>
        <p class="hint" id="sys-h"></p>
        <p class="hint" id="smp-h" style="white-space:pre-line"></p>
        <button type="button" class="pill" id="smp-reset" style="margin-bottom:6px"></button>
        <p class="hint" id="rt-h" style="white-space:pre-line"></p>
    </div>
</section>
<section class="bsheet" id="sh-hist" aria-label="Chats">
    <div class="grab"></div>
    <div class="bs-h"><h3 id="sh-h"></h3><button class="ibtn" type="button" data-click="sheetClose" aria-label="Close"><svg class="i"><use href="/lib/icons.svg#i-x"/></svg></button></div>
    <div class="bs-b"><div class="seg2" id="sortseg" style="margin-bottom:8px"><button type="button" data-sort="time"></button><button type="button" data-sort="az"></button></div><div class="lst" id="chats"></div></div>
</section>

<script type="module" src="/lib/chat/main.js"></script>
</body>
</html>
