<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#121212">
<meta name="color-scheme" content="dark light">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>AIUIheinz</title>
<link rel="stylesheet" href="/lib/core.css">
<script src="/lib/core.js"></script>
<style>
body { margin: 0; background: var(--bg); color: var(--txt); font-family: var(--font); }
.wrap { max-width: 600px; margin: 0 auto; padding: 0 16px; }
.top { display: flex; align-items: center; gap: 12px; padding: 16px 0 14px; }
.top .ttl { flex: 1; min-width: 0; line-height: 1.2; }
.top .ttl b { font-size: 1.25rem; font-weight: 500; letter-spacing: .01em; display: block; }
.top .ttl small { display: block; margin-top: 2px; color: var(--sub); font-family: var(--serif); font-style: italic; font-size: .85rem; }
a.ring-btn { text-decoration: none; color: var(--txt); }
#ring { --s: var(--edge); }
.areas { display: flex; gap: 22px; margin: 18px 0 6px; border-bottom: 1px solid var(--line); }
.areas button { background: none; border: 0; padding: 8px 0 11px; font: inherit; font-size: .95rem; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.areas button.on { color: var(--txt); border-bottom-color: var(--acc, var(--pri)); }
a.row { text-decoration: none; }
a.row .tile { color: var(--pri); }
.row .tag { font-size: .68rem; color: var(--sub); border: 1px solid var(--edge); border-radius: 99px; padding: 2px 8px; flex: none; }
.drawer { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px 8px; padding: 18px 0 4px; }
.app { display: flex; flex-direction: column; align-items: center; gap: 8px; text-decoration: none; color: var(--txt); font-size: .78rem; text-align: center; }
.app .ic { width: 68px; height: 68px; border-radius: 20px; background: var(--card); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.app .ic img { width: 100%; height: 100%; object-fit: cover; }
.app .ic .i { width: 30px; height: 30px; }
.app.soon { opacity: .5; }
.app:active .ic { transform: scale(.96); }
.sr { position: absolute; left: -9999px; }
.foot { margin: 34px 0 40px; color: var(--muted); font-size: .72rem; text-align: center; letter-spacing: .04em; }
</style>
</head>
<body>
<div class="wrap">
<div class="top">
    <a class="ring-btn" id="ring" href="/" aria-label="Heinz UI"><svg class="i"><use href="/lib/icons.svg#i-heinz"/></svg></a>
    <div class="ttl"><b>AIUI<span style="color:var(--pri)">heinz</span></b><small id="sub"></small></div>
    <button class="ibtn" id="theme" type="button" aria-label="Theme"><svg class="i"><use href="/lib/icons.svg#i-contrast"/></svg></button>
    <button class="lang-btn" id="lang-btn" type="button" aria-label="EN / DE"><span data-l="en">EN</span><span data-l="de">DE</span></button>
</div>
<div class="sr" id="status" role="status"><span id="t-ollama">…</span> <span id="t-litert">…</span></div>
<nav class="areas" id="areas"></nav>
<main>
    <div id="tools"></div>
    <div class="caps" id="legacy-h" hidden style="margin-top:26px"></div>
    <div id="legacy"></div>
</main>
<div class="foot" id="foot"></div>
</div>
<script>
(function () {
    var D = {
        en: { sub: 'Private AI tools that work offline.', ollamaOff: 'not reachable', litertOff: 'not reachable (optional)', up: 'running', loaded: 'loaded: {m}', models: '{n} models', soon: 'placeholder', legacy: 'Old versions', foot: 'OFFLINE FIRST · NOTHING LEAVES THIS DEVICE', noTools: 'No tools found (server too old?)', aChat: 'Chats & models', aTools: 'Tools', empty: 'Nothing here yet.' },
        de: { sub: 'Private KI-Werkzeuge, die offline laufen.', ollamaOff: 'nicht erreichbar', litertOff: 'nicht erreichbar (optional)', up: 'läuft', loaded: 'geladen: {m}', models: '{n} Modelle', soon: 'Platzhalter', legacy: 'Alte Versionen', foot: 'OFFLINE ZUERST · NICHTS VERLÄSST DIESES GERÄT', noTools: 'Keine Tools gefunden (Server zu alt?)', aChat: 'Chats & Modelle', aTools: 'Tools', empty: 'Hier ist noch nichts.' }
    };
    var AREAS = [{ id: 'chat', k: 'aChat' }, { id: 'tools', k: 'aTools' }];
    var COL = { blue: '#4285f4', green: '#34a853', red: '#ea4335', yellow: '#fbbc05', gray: '#9aa0a6' };
    var tools = null, ollama = null, litert = null, area = 'chat';
    try { var sv = Heinz.lsGet('heinz_hub', {}).area; if (sv === 'chat' || sv === 'tools') area = sv; } catch (e) {}
    function t(k, v) { return Heinz.t(D, k, v); }
    function safePath(s) { return typeof s === 'string' && /^[\w.\/-]+$/.test(s) && s.indexOf('..') < 0 ? s : ''; }
    function sym(x) { return /^i-[a-z-]+$/.test(x.symbol || '') ? x.symbol : 'i-sparkle'; }
    function row(x) {
        return '<a class="row" href="' + Heinz.esc(x.entry) + '" data-tool="' + Heinz.esc(x.id) + '">' +
            '<span class="tile"><svg class="i"><use href="/lib/icons.svg#' + sym(x) + '"/></svg></span>' +
            '<span class="tx"><b>' + Heinz.esc(Heinz.pick(x.name)) + '</b><small>' + Heinz.esc(Heinz.pick(x.desc)) + '</small></span>' +
            (x.status === 'placeholder' ? '<span class="tag">' + t('soon') + '</span>' : '') +
            '<svg class="i sm go"><use href="/lib/icons.svg#i-chev-r"/></svg></a>';
    }
    function app(x) {
        var img = safePath(x.appicon), c = COL[x.color] || 'var(--pri)';
        return '<a class="app' + (x.status === 'placeholder' ? ' soon' : '') + '" href="' + Heinz.esc(x.entry) + '" data-tool="' + Heinz.esc(x.id) + '" title="' + Heinz.esc(Heinz.pick(x.desc)) + '">' +
            '<span class="ic">' + (img ? '<img src="/' + Heinz.esc(img) + '" alt="">' : '<svg class="i" style="color:' + c + '"><use href="/lib/icons.svg#' + sym(x) + '"/></svg>') + '</span>' +
            '<span>' + Heinz.esc(Heinz.pick(x.name)) + '</span></a>';
    }
    function render() {
        document.getElementById('sub').textContent = t('sub');
        document.getElementById('areas').innerHTML = AREAS.map(function (a) {
            return '<button type="button" class="' + (a.id === area ? 'on' : '') + '" data-area="' + a.id + '">' + t(a.k) + '</button>';
        }).join('');
        var tl = document.getElementById('tools'), lg = document.getElementById('legacy'), lh = document.getElementById('legacy-h');
        if (tools) {
            var mine = tools.filter(function (x) { return (x.area || 'tools') === area; });
            var main = mine.filter(function (x) { return !x.legacy; }), old = mine.filter(function (x) { return x.legacy; });
            if (!main.length) tl.innerHTML = '<p style="color:var(--sub)">' + (tools.length ? t('empty') : t('noTools')) + '</p>';
            else if (area === 'tools') tl.innerHTML = '<div class="drawer">' + main.map(app).join('') + '</div>';
            else tl.innerHTML = main.map(row).join('');
            lg.innerHTML = old.map(row).join('');
            lh.hidden = !old.length; lh.textContent = t('legacy');
        }
        var ot = document.getElementById('t-ollama');
        if (ollama) {
            ot.textContent = 'Ollama ' + (ollama.up ? (ollama.loaded.length ? t('loaded', { m: ollama.loaded.join(', ') }) : t('up') + ' · ' + t('models', { n: ollama.models.length })) : t('ollamaOff'));
        }
        if (litert) document.getElementById('t-litert').textContent = 'LiteRT-LM ' + (litert.up ? t('up') : t('litertOff'));
        document.getElementById('foot').textContent = t('foot');
        document.title = 'AIUIheinz';
    }
    document.getElementById('areas').addEventListener('click', function (e) {
        var b = e.target.closest('[data-area]'); if (!b) return;
        area = b.dataset.area;
        try { var s = Heinz.lsGet('heinz_hub', {}); s.area = area; Heinz.lsSet('heinz_hub', s); } catch (er) {}
        render();
    });
    document.getElementById('theme').onclick = function () { Heinz.setTheme(Heinz.theme === 'auto' ? 'dk' : Heinz.theme === 'dk' ? 'lt' : 'auto'); };
    var lb = document.getElementById('lang-btn');
    lb.onclick = Heinz.toggleLang;
    function lbPaint() { Array.prototype.forEach.call(lb.querySelectorAll('span'), function (s) { s.classList.toggle('active', s.getAttribute('data-l') === Heinz.lang); }); document.documentElement.lang = Heinz.lang; }
    Heinz.onLang(function () { lbPaint(); render(); });
    lbPaint(); render();
    fetch('/api/tools').then(function (r) { return r.json(); }).then(function (j) { tools = j.tools || []; render(); }).catch(function () { tools = []; render(); });
    function poll() {
        Heinz.pingOllama().then(function (r) { ollama = r; render(); });
        Heinz.pingLiteRT().then(function (r) { litert = r; render(); });
    }
    poll(); setInterval(poll, 8000);
})();
</script>
</body>
</html>
