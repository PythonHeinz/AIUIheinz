<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#121212">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>AIUIheinz</title>
<link rel="stylesheet" href="/lib/core.css">
</head>
<body>
<div id="app-header"></div>
<main class="page">
    <div class="status" id="status">
        <div class="row"><span class="dot" id="dot-ollama"></span><span><b>Ollama</b> <span id="t-ollama">…</span></span></div>
        <div class="row"><span class="dot" id="dot-litert"></span><span><b>LiteRT-LM</b> <span id="t-litert">…</span></span></div>
    </div>
    <div class="grid" id="tools"></div>
    <div class="sect" id="legacy-h" hidden></div>
    <div class="grid" id="legacy"></div>
    <div class="foot" id="foot"></div>
</main>
<script src="/lib/core.js"></script>
<script>
(function () {
    var D = {
        en: { sub: 'offline AI', ollamaOff: 'not reachable', litertOff: 'not reachable (optional)', up: 'running', loaded: 'loaded: {m}', models: '{n} models', soon: 'placeholder', old: 'old', legacy: 'Old versions', foot: 'Viewport reference: Pixel 9 Pro about 426 × 803 px', noTools: 'No tools found (server too old?)' },
        de: { sub: 'offline KI', ollamaOff: 'nicht erreichbar', litertOff: 'nicht erreichbar (optional)', up: 'läuft', loaded: 'geladen: {m}', models: '{n} Modelle', soon: 'Platzhalter', old: 'alt', legacy: 'Alte Versionen', foot: 'Referenz-Viewport: Pixel 9 Pro rund 426 × 803 px', noTools: 'Keine Tools gefunden (Server zu alt?)' }
    };
    var tools = null, ollama = null, litert = null;
    function t(k, v) { return Heinz.t(D, k, v); }
    function card(x) {
        var c = x.legacy ? 'c-gray' : 'c-' + (x.color || 'blue');
        var tag = x.status === 'placeholder' ? t('soon') : (x.legacy ? t('old') : '');
        return '<a class="card ' + c + '" href="' + Heinz.esc(x.entry) + '" data-tool="' + Heinz.esc(x.id) + '">' +
            (tag ? '<span class="tag">' + tag + '</span>' : '') +
            '<span class="ico">' + Heinz.esc(x.icon || '🧩') + '</span><h2>' + Heinz.esc(Heinz.pick(x.name)) + '</h2><p>' + Heinz.esc(Heinz.pick(x.desc)) + '</p></a>';
    }
    function render() {
        var tl = document.getElementById('tools'), lg = document.getElementById('legacy'), lh = document.getElementById('legacy-h');
        if (tools) {
            var main = tools.filter(function (x) { return !x.legacy; }), old = tools.filter(function (x) { return x.legacy; });
            tl.innerHTML = main.length ? main.map(card).join('') : '<div class="panel">' + t('noTools') + '</div>';
            lg.innerHTML = old.map(card).join('');
            lh.hidden = !old.length; lh.textContent = t('legacy');
        }
        var o = document.getElementById('dot-ollama'), ot = document.getElementById('t-ollama');
        if (ollama) {
            o.className = 'dot ' + (ollama.up ? (ollama.loaded.length ? 'run' : 'on') : '');
            ot.textContent = ollama.up ? (ollama.loaded.length ? t('loaded', { m: ollama.loaded.join(', ') }) : t('up') + ' · ' + t('models', { n: ollama.models.length })) : t('ollamaOff');
        }
        var l = document.getElementById('dot-litert'), lt = document.getElementById('t-litert');
        if (litert) { l.className = 'dot ' + (litert.up ? 'on' : ''); lt.textContent = litert.up ? t('up') : t('litertOff'); }
        document.getElementById('foot').textContent = t('foot');
        document.title = 'AIUIheinz';
    }
    Heinz.header({ sub: { en: D.en.sub, de: D.de.sub } });
    Heinz.onLang(render);
    render();
    fetch('/api/tools').then(function (r) { return r.json(); }).then(function (j) { tools = j.tools || []; render(); }).catch(function () { tools = []; render(); });
    function poll() {
        Heinz.pingOllama().then(function (r) { ollama = r; render(); });
        Heinz.pingLiteRT().then(function (r) { litert = r; render(); });
    }
    poll(); setInterval(poll, 8000);
})();
</script>
</body>
</html>
